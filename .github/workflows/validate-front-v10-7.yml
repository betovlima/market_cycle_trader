name: Validate Front v10.7.0

on:
  push:
    branches:
      - feat/10.7.0-temporal-outlook

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[front v10.7 validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/10.7.0-temporal-outlook
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/validate-front-v10-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete Front validation [front v10.7 validated]"
          git push origin HEAD:feat/10.7.0-temporal-outlook
